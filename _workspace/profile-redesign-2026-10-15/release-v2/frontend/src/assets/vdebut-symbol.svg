<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- V Shape Gradient -->
    <linearGradient id="vGrad" x1="60" y1="60" x2="450" y2="450" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF5C8A"/>
      <stop offset="50%" stop-color="#B86ADF"/>
      <stop offset="100%" stop-color="#8C7CFF"/>
    </linearGradient>

    <!-- Spotlight Beam Gradient -->
    <linearGradient id="spotlightBeam" x1="256" y1="440" x2="256" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFF5D6" stop-opacity="0.95"/>
      <stop offset="35%" stop-color="#FFD76A" stop-opacity="0.75"/>
      <stop offset="70%" stop-color="#8C7CFF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#8C7CFF" stop-opacity="0"/>
    </linearGradient>

    <!-- Base Stage Glow -->
    <radialGradient id="stageGlow" cx="256" cy="430" r="140" fx="256" fy="430" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFF0B3" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#FFD76A" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#FF5C8A" stop-opacity="0"/>
    </radialGradient>

    <!-- Spark Star Gradient -->
    <linearGradient id="sparkGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFD76A"/>
      <stop offset="100%" stop-color="#FF5C8A"/>
    </linearGradient>
  </defs>

  <!-- Background Base Stage Light Glow -->
  <ellipse cx="256" cy="430" rx="130" ry="32" fill="url(#stageGlow)" />

  <!-- Spotlight Cone Beam -->
  <polygon points="256,420 155,160 357,160" fill="url(#spotlightBeam)" />
  <ellipse cx="256" cy="160" rx="101" ry="22" fill="#FFFFFF" fill-opacity="0.4" />

  <!-- Outer V Shape (Rounded Bold V) -->
  <path d="M 85 105 
           C 72 105 62 116 64 129
           L 218 435
           C 225 449 240 458 256 458
           C 272 458 287 449 294 435
           L 448 129
           C 450 116 440 105 427 105
           L 362 105
           C 351 105 341 112 337 122
           L 256 310
           L 175 122
           C 171 112 161 105 150 105
           Z" 
        fill="url(#vGrad)" />

  <!-- Inner V Cut Highlight Beam -->
  <path d="M 175 122 L 256 310 L 337 122 L 427 105 L 294 435 C 287 449 272 458 256 458 C 240 458 225 449 218 435 L 85 105 L 150 105 Z"
        fill="url(#spotlightBeam)" opacity="0.25" />

  <!-- Top Center Spark (✦ Star) -->
  <g transform="translate(256, 125) scale(1.4)">
    <path d="M 0 -24 Q 0 0 24 0 Q 0 0 0 24 Q 0 0 -24 0 Q 0 0 0 -24 Z" fill="url(#sparkGrad)"/>
  </g>
</svg>
