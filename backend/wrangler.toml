name = "streaming"
main = "src/index.ts"
compatibility_date = "2024-01-01"

[site]
bucket = "../frontend/dist"

[vars]
DISCORD_APPLICATION_ID = "1547493885733900351"
DISCORD_PUBLIC_KEY = "5f3ac194f940bbe736f80fcc269b1df45da5cc86b60fe6b85a34a6705572f285"
# 참고: DISCORD_BOT_TOKEN 등 비밀 토큰은 `wrangler secret put DISCORD_BOT_TOKEN`으로 안전하게 관리합니다.

[[d1_databases]]
binding = "DB"
database_name = "vdebut-db"
database_id = "888a8c04-5657-4bff-9b50-5002a47ac7c7"
migrations_dir = "migrations"

# Default (dev) env
[env.dev]
name = "streaming-dev"
routes = [
  { pattern = "dev.vdebut.live/*", zone_name = "vdebut.live" }
]
[env.dev.vars]
PORTAL_ENABLED = "true"
DISCORD_APPLICATION_ID = "1547493885733900351"
DISCORD_PUBLIC_KEY = "5f3ac194f940bbe736f80fcc269b1df45da5cc86b60fe6b85a34a6705572f285"

[env.dev.triggers]
crons = ["0 15 * * SUN"]
[[env.dev.d1_databases]]
binding = "DB"
database_name = "vdebut-db"
database_id = "888a8c04-5657-4bff-9b50-5002a47ac7c7"

# Production (live) env
[env.production]
name = "streaming"
# 운영 Worker의 기존 접근 주소와 도메인 연결을 보존한다.
workers_dev = true
preview_urls = true
routes = [
  { pattern = "vdebut.live", custom_domain = true },
  { pattern = "dev.vdebut.live", custom_domain = true }
]
[env.production.vars]
PORTAL_ENABLED = "true"
DISCORD_APPLICATION_ID = "1547493885733900351"
DISCORD_PUBLIC_KEY = "5f3ac194f940bbe736f80fcc269b1df45da5cc86b60fe6b85a34a6705572f285"

[[env.production.d1_databases]]
binding = "DB"
database_name = "vdebut-db"
database_id = "888a8c04-5657-4bff-9b50-5002a47ac7c7"

[triggers]
crons = ["*/10 * * * *", "0 22 * * *"]

# 환경별 트리거를 명시해 운영 배포 시 기존 예약 작업을 보존한다.
[env.production.triggers]
crons = ["*/10 * * * *", "0 22 * * *"]
