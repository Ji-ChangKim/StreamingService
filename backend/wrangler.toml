name = "v-debut-hub-backend"
main = "src/index.ts"
compatibility_date = "2024-01-01"

# Default (dev) env
[env.dev]
name = "v-debut-hub-backend-dev"
[[env.dev.d1_databases]]
binding = "DB"
database_name = "v-debut-hub-db-dev"
database_id = "v-debut-hub-db-dev-id"

# Production (live) env
[env.production]
name = "v-debut-hub-backend-live"
[[env.production.d1_databases]]
binding = "DB"
database_name = "v-debut-hub-db-live"
database_id = "v-debut-hub-db-live-id"
