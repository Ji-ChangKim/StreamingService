name: Collect Virtual Debut Report (No DB Writes)

on:
  schedule:
    # 기존 한국 시간 09:00·21:00 수집 일정을 유지한다.
    - cron: '0 0,12 * * *'
  workflow_dispatch:

# 후보 보고서만 생성하며 저장소·배포·DB 쓰기 권한은 부여하지 않는다.
permissions:
  contents: read

concurrency:
  group: debut-crawler-report
  cancel-in-progress: false

jobs:
  collect-report:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout report client
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # 보고 주소가 미배포·차단 상태면 실패하며 기존 자동 등록 주소로 재시도하지 않는다.
      - name: Collect report without DB or email
        env:
          CRAWLER_SECRET: ${{ secrets.CRAWLER_REPORT_SECRET }}
        run: node backend/scripts/collect_debut_report.cjs

      # 성공한 보고서는 로그 전체 출력 대신 별도 산출물로 보관한다.
      - name: Save candidate report
        uses: actions/upload-artifact@v4
        with:
          name: debut-candidates-${{ github.run_id }}-${{ github.run_attempt }}
          path: crawler-report/report.json
          if-no-files-found: error
          retention-days: 7
