name: Investigate Virtual Debut Announcements (Report Only)

on:
  schedule:
    # 한국 시간 09:00·21:00. GitHub 스케줄은 지연될 수 있다.
    - cron: '0 0,12 * * *'
  workflow_dispatch:

# 소스 읽기와 보고서 보관만 허용한다. Cloudflare 배포 인증은 전달하지 않는다.
permissions:
  contents: read

concurrency:
  group: debut-crawler-report
  cancel-in-progress: false

jobs:
  investigate-report:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout investigation code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install report parser dependencies
        run: npm ci --prefix backend --ignore-scripts --no-audit --no-fund

      - name: Test investigation rules without external requests
        run: node --test backend/tests/debutInvestigation.test.cjs

      # 이전 성공 보고서만 비교 기준으로 사용하며 캐시가 없으면 첫 실행으로 표시한다.
      - name: Restore previous report for comparison
        uses: actions/cache/restore@v4
        with:
          path: investigation-baseline
          key: debut-investigation-v2-main-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: debut-investigation-v2-main-

      # 미등록 API 키는 미설정 상태로 보고한다. 수집·검증에는 DB 인증이 없다.
      - name: Collect classify and verify public announcements
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          CHZZK_CLIENT_ID: ${{ secrets.CHZZK_CLIENT_ID }}
          CHZZK_CLIENT_SECRET: ${{ secrets.CHZZK_CLIENT_SECRET }}
          INVESTIGATION_BASELINE: investigation-baseline/report.json
        run: node backend/scripts/investigate_debuts.cjs

      - name: Save evidence and approval preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debut-investigation-${{ github.run_id }}-${{ github.run_attempt }}
          path: crawler-report/
          if-no-files-found: error
          retention-days: 14

      - name: Save successful report for next comparison
        if: success()
        uses: actions/cache/save@v4
        with:
          path: investigation-baseline
          key: debut-investigation-v2-main-${{ github.run_id }}-${{ github.run_attempt }}
