name: Auto Refresh Virtual Debut Data & Run Crawler

on:
  schedule:
    # 매일 한국 시간 오전 09:00 (UTC 00:00) 및 오후 21:00 (UTC 12:00) 정기 수집
    - cron: '0 0,12 * * *'
  workflow_dispatch: # 수동 실행 지원

jobs:
  run-crawler:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Debut Crawler Process API
        run: |
          echo "Starting Virtual Debut Crawler Auto-Refresh via GitHub Action..."
          
          TARGET_URL="https://vdebut.live/api/v1/admin/crawler/run"
          USER_AGENT="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"
          
          # API 호출 실행 (Cloudflare WAF 우회를 위한 User-Agent 및 안전한 HTTP 상태 코드 수집)
          HTTP_STATUS=$(curl -s -o response.json -w "%{http_code}" --max-time 60 -X POST "$TARGET_URL" \
            -A "$USER_AGENT" \
            -H "Content-Type: application/json" \
            -H "Accept: application/json" \
            -d '{"recipientEmail": "kimjichang1234@gmail.com"}' || echo "000")
          
          echo "Endpoint HTTP Status: $HTTP_STATUS"
          echo "--- Response Body ---"
          cat response.json || true
          echo ""
          echo "---------------------"
          
          # 결과 검증
          if [ "$HTTP_STATUS" -eq 200 ]; then
            echo "✅ Virtual Debut Crawler Process Executed Successfully!"
          else
            echo "❌ Virtual Debut Crawler Process Failed with HTTP Status: $HTTP_STATUS"
            exit 1
          fi

